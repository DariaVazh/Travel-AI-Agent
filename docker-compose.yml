services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSL: "false"

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    command: ["python", "-m", "botD.bot"]
    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSL: "false"

    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ostrovok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: free_penguins_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ostrovok -d free_penguins_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    command: ["python", "-m", "alembic", "upgrade", "head"]

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSL: "false"

    depends_on:
      db:
        condition: service_healthy

    restart: "no"


volumes:
  postgres_data:

