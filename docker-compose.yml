services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    build: .
    command: ["python", "-m", "botD.bot"]
    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSL: "false"

    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ostrovok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: free_penguins_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:

